<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #ffffff;">
    <defs>
        <style>
            .zone-border { fill: #fcfcfc; stroke: #e0e0e0; stroke-width: 2; stroke-dasharray: 8,4; }
            .zone-title { font-family: "Arial", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: bold; fill: #bbbbbb; }
            
            .box-biz { fill: #f3e5f5; stroke: #8e24aa; stroke-width: 2; }
            .box-core { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
            .box-mutex { fill: #ffebee; stroke: #c62828; stroke-width: 2; stroke-dasharray: 4,4; }
            .box-isr { fill: #fff3e0; stroke: #ef6c00; stroke-width: 2; }
            
            .text-main { font-family: "Arial", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: bold; fill: #333333; }
            .text-sub { font-family: "Arial", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #666666; }
            .text-code { font-family: "Consolas", "Courier New", monospace; font-size: 14px; fill: #000000; }
            .text-label { font-family: "Arial", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #444444; font-weight: bold; }
            
            .line-solid { stroke: #333333; stroke-width: 2; fill: none; }
            .line-dashed { stroke: #555555; stroke-width: 2; stroke-dasharray: 6,6; fill: none; }
            .line-heavy { stroke: #1976d2; stroke-width: 4; fill: none; }
        </style>
    </defs>

    <rect x="20" y="40" width="280" height="620" rx="10" class="zone-border" />
    <text x="70" y="80" class="zone-title">Zone 1: 外部业务线程</text>

    <rect x="320" y="40" width="360" height="620" rx="10" class="zone-border" />
    <text x="400" y="80" class="zone-title">Zone 2: 主 UI/渲染线程</text>

    <rect x="700" y="40" width="280" height="620" rx="10" class="zone-border" />
    <text x="740" y="80" class="zone-title">Zone 3: 硬件 / ISR 层</text>


    <rect x="50" y="200" width="220" height="70" rx="8" class="box-biz" />
    <text x="160" y="235" class="text-main" text-anchor="middle">
        <tspan x="160" dy="-5">业务线程 A (如网络)</tspan>
        <tspan x="160" dy="20" class="text-sub">获取数据并更新 UI</tspan>
    </text>

    <rect x="50" y="320" width="220" height="70" rx="8" class="box-biz" />
    <text x="160" y="355" class="text-main" text-anchor="middle">
        <tspan x="160" dy="-5">业务线程 B (如传感器)</tspan>
        <tspan x="160" dy="20" class="text-sub">异步状态更新</tspan>
    </text>

    <rect x="360" y="140" width="280" height="420" rx="15" class="box-core" />
    <text x="500" y="170" class="text-main" text-anchor="middle" fill="#1565c0">LVGL God Thread (while 1)</text>

    <rect x="345" y="200" width="30" height="190" rx="5" class="box-mutex" />
    <text x="365" y="300" transform="rotate(-90 365 300)" class="text-label" fill="#c62828" text-anchor="middle">OS Mutex Lock</text>

    <rect x="400" y="210" width="200" height="60" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
    <text x="500" y="240" class="text-main" text-anchor="middle" dominant-baseline="middle">处理外部事件 / 动画</text>

    <rect x="400" y="300" width="200" height="60" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
    <text x="500" y="325" class="text-main" text-anchor="middle">
        <tspan x="500" dy="0">布局与脏矩形计算</tspan>
        <tspan x="500" dy="18" class="text-code">lv_refr_obj()</tspan>
    </text>

    <rect x="400" y="390" width="200" height="60" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
    <text x="500" y="415" class="text-main" text-anchor="middle">
        <tspan x="500" dy="0">软件光栅化 (Render)</tspan>
        <tspan x="500" dy="18" class="text-code">lv_draw_ctx()</tspan>
    </text>
    
    <rect x="400" y="480" width="200" height="50" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1" />
    <text x="500" y="510" class="text-code" text-anchor="middle" dominant-baseline="middle">flush_cb()</text>


    <rect x="730" y="140" width="220" height="70" rx="8" class="box-isr" />
    <text x="840" y="175" class="text-main" text-anchor="middle">
        <tspan x="840" dy="-5">Timer / SysTick ISR</tspan>
        <tspan x="840" dy="20" class="text-code">lv_tick_inc()</tspan>
    </text>

    <rect x="730" y="470" width="220" height="70" rx="8" class="box-isr" />
    <text x="840" y="500" class="text-main" text-anchor="middle">
        <tspan x="840" dy="-5">Display DMA Engine</tspan>
        <tspan x="840" dy="20" class="text-sub">显存至屏幕的异步硬件搬运</tspan>
    </text>


    <path d="M730,175 L650,175" class="line-dashed" />
    <polygon points="650,175 662,169 662,181" fill="#555555" />
    <text x="690" y="165" class="text-label" text-anchor="middle">喂心跳</text>

    <path d="M270,235 L335,235" class="line-solid" />
    <polygon points="335,235 323,229 323,241" fill="#333333" />
    <text x="300" y="225" class="text-label" text-anchor="middle">1. 上锁</text>

    <path d="M270,355 L300,355 L300,280 L335,280" class="line-solid" />
    <polygon points="335,280 323,274 323,286" fill="#333333" />
    <text x="315" y="270" class="text-label" text-anchor="end">1. 上锁</text>

    <path d="M500,270 L500,290" class="line-heavy" />
    <polygon points="500,290 494,278 506,278" fill="#1976d2" />

    <path d="M500,360 L500,380" class="line-heavy" />
    <polygon points="500,380 494,368 506,368" fill="#1976d2" />

    <path d="M500,450 L500,470" class="line-heavy" />
    <polygon points="500,470 494,458 506,458" fill="#1976d2" />

    <path d="M400,505 L380,505 L380,240 L390,240" class="line-heavy" />
    <polygon points="390,240 378,234 378,246" fill="#1976d2" />

    <path d="M600,505 L720,505" class="line-solid" />
    <polygon points="720,505 708,499 708,511" fill="#333333" />
    <text x="660" y="495" class="text-label" text-anchor="middle">启动传输</text>

    <path d="M770,540 L770,580 L500,580 L500,540" class="line-dashed" />
    <polygon points="500,540 494,552 506,552" fill="#555555" />
    <text x="635" y="570" class="text-label" text-anchor="middle">DMA 中断: lv_disp_flush_ready() 通知传输完成</text>

    <text x="325" y="420" class="text-label" fill="#c62828" text-anchor="end">2. 解锁</text>

</svg>
